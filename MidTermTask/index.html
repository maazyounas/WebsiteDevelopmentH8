<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>User Registration Form</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="container">
    <h1>User Registration</h1>

    <form id="userForm">
      <label for="firstName">First Name</label>
      <input type="text" id="firstName" placeholder="Enter first name" required>

      <label for="lastName">Second Name</label>
      <input type="text" id="lastName" placeholder="Enter second name" required>

      <label for="email">Email Address</label>
      <input type="email" id="email" placeholder="Enter email address" required>

      <label for="phone">Phone Number</label>
      <input type="tel" id="phone" placeholder="Enter phone number" required>

      <label for="age">Age</label>
      <input type="number" id="age" placeholder="Enter age" min="1" max="120" required>

      <label>Gender</label>
      <div class="gender-group">
        <label class="checkbox-label">
          <input type="checkbox" id="male" value="Male"> Male
        </label>
        <label class="checkbox-label">
          <input type="checkbox" id="female" value="Female"> Female
        </label>
      </div>

      <label for="city">City</label>
      <select id="city" required>
        <option value="">-- Select your city --</option>
        <option value="Islamabad">Islamabad</option>
        <option value="Lahore">Lahore</option>
        <option value="Karachi">Karachi</option>
        <option value="Peshawar">Peshawar</option>
        <option value="Quetta">Quetta</option>
        <option value="Rawalpindi">Rawalpindi</option>
      </select>

      <label for="address">Complete Address</label>
      <textarea id="address" rows="3" placeholder="Enter your complete address" required></textarea>

      <p id="errorMsg" class="error"></p>

      <button type="submit">Submit</button>
    </form>

    <div id="output" class="output">
      <h2>Output</h2>
      <p class="placeholder">Submitted data will appear here.</p>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
